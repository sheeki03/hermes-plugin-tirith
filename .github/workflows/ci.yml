name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tirith_ref:
        description: >-
          sheeki03/tirith commit (40-hex SHA) to build and run the real-tirith tests against.
          Empty: only the fake-tirith tests run.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.16.10 pyyaml==6.0.3
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q tirith tests
      - name: plugin.yaml parses
        run: python -c "import yaml; yaml.safe_load(open('tirith/plugin.yaml', encoding='utf-8'))"

  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==9.1.1 pyyaml==6.0.3
      - name: Fake-tirith tests
        run: python -m pytest -m "not realtirith and not hermes"

  hermes:
    name: hermes loader (${{ matrix.os }}, ${{ matrix.host.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # Hermes main moves: a failure there warns about a coming release and does not fail the run.
    continue-on-error: ${{ matrix.host.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Released versions: the minimum, the last 0.21 release, the last release whose CLI runs plugin
        # hooks in its own process, and the latest release; then Hermes main, which may fail.
        host:
          # 0.21.5 declares requires-python ">=3.11,<3.14"; later releases allow 3.14.
          - label: minimum-0.21.5
            ref: f97608f178d1ffeca59860195ab7da295f7c8e5f # tag v2026.9.24, released as 0.21.5
            python: "3.13"
            installer: pip
            experimental: false
          - label: "0.21.7"
            ref: 71d34bad1045610252eda02ee79549436896e784 # v0.21.7
            python: "3.14"
            installer: pip
            experimental: false
          - label: "0.22.2"
            ref: d923a5eb487a17c0a68801bba9ef0f56c81040a8 # v0.22.2
            python: "3.14"
            installer: pip
            experimental: false
          # From 0.22.3 the CLI, TUI and Desktop run plugin hooks in Hermes's gateway process.
          - label: latest-0.22.5
            ref: bf0203a794a07aac3ff764972ab9087baa4e4f4e # v0.22.5
            python: "3.14"
            installer: uv
            experimental: false
          - label: main
            ref: main
            python: "3.14"
            installer: uv
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.host.ref }}
          path: hermes-agent
          persist-credentials: false
          # A source checkout takes its version from the release tags in its history. Without them
          # Hermes reports "unknown", which passes every requires_hermes, and the floor test cannot run.
          fetch-depth: 0
          filter: tree:0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.host.python }}
      - name: Install Hermes with pip
        if: matrix.host.installer == 'pip'
        run: python -m pip install -e ./hermes-agent pytest==9.1.1 pyyaml==6.0.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: matrix.host.installer == 'uv'
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Install Hermes with uv
        if: matrix.host.installer == 'uv'
        # Hermes 0.22.3 and later resolve only with the override-dependencies in their pyproject.toml
        # ([tool.uv]), which uv applies when it runs in the checkout; pip fails on Python 3.14
        # (Pillow==13.0.0 against browser-harness's pillow==12.3.0).
        working-directory: hermes-agent
        run: uv pip install --system -e . pytest==9.1.1 pyyaml==6.0.3
      - name: Loader, approval gate, validate and doctor tests
        env:
          HERMES_VERSION_REQUIRED: "1"  # the requires_hermes floor test fails instead of skipping
        run: python -m pytest -m hermes
      - name: hermes plugins validate --install-deps
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/validate-home" HERMES_HOME="$RUNNER_TEMP/validate-home/.hermes"
          mkdir -p "$HERMES_HOME"
          hermes plugins validate --install-deps tirith </dev/null

  catalog-validate:
    # The same gate the Hermes plugin catalog CI runs for an entry.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: NousResearch/hermes-agent/.github/actions/plugin-validate@bf0203a794a07aac3ff764972ab9087baa4e4f4e # v0.22.5
        with:
          path: tirith
          hermes-ref: bf0203a794a07aac3ff764972ab9087baa4e4f4e

  real-tirith:
    # Runs only when a tirith is provided: workflow_dispatch with tirith_ref builds that commit as the
    # candidate. The released 0.4.2 (checksums pinned below) is downloaded as the binary the gate must refuse.
    if: github.event_name == 'workflow_dispatch' && inputs.tirith_ref != ''
    name: real tirith (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            old_asset: tirith-x86_64-unknown-linux-gnu.tar.gz
            old_sha256: efa6bf414a83dba385d4f13137e8677f850ced9102fe74ebb14c72f31df0dc77
          - os: macos-latest
            old_asset: tirith-aarch64-apple-darwin.tar.gz
            old_sha256: 551f9a6ebf58344e7d0aa06bcc78d7a4f2f7b44b8011be563e0a91976cc9c4df
    steps:
      - name: Check tirith_ref is a commit SHA
        env:
          TIRITH_REF: ${{ inputs.tirith_ref }}
        shell: bash
        run: '[[ "$TIRITH_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "tirith_ref must be a 40-hex commit SHA"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sheeki03/tirith
          ref: ${{ inputs.tirith_ref }}
          path: tirith-src
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tirith-src
      - name: Build the candidate tirith
        working-directory: tirith-src
        run: cargo build --release --locked -p tirith
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install pytest==9.1.1 pyyaml==6.0.3
      - name: Download tirith 0.4.2 (sha256 pinned)
        env:
          ASSET: ${{ matrix.old_asset }}
          SHA256: ${{ matrix.old_sha256 }}
        run: |
          python - <<'PY'
          import hashlib, os, tarfile, urllib.request
          asset, expected = os.environ["ASSET"], os.environ["SHA256"]
          url = f"https://github.com/sheeki03/tirith/releases/download/v0.4.2/{asset}"
          data = urllib.request.urlopen(url, timeout=120).read()
          digest = hashlib.sha256(data).hexdigest()
          assert digest == expected, f"sha256 mismatch for {asset}: {digest}"
          dest = os.path.join(os.environ["RUNNER_TEMP"], "tirith-0.4.2")
          os.makedirs(dest, exist_ok=True)
          path = os.path.join(dest, asset)
          with open(path, "wb") as handle:
              handle.write(data)
          with tarfile.open(path) as archive:
              archive.extractall(dest, filter="data")
          binary = next(os.path.join(root, name) for root, _dirs, files in os.walk(dest) for name in files if name == "tirith")
          os.chmod(binary, 0o755)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"TIRITH_OLD_BIN={binary}\n")
          PY
      - name: Real-tirith and corpus tests
        env:
          TIRITH_TEST_BIN: ${{ github.workspace }}/tirith-src/target/release/tirith
          TIRITH_CORPUS_REPORT: ${{ runner.temp }}/corpus-report.md
        run: python -m pytest -m realtirith
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: corpus-report-${{ matrix.os }}
          path: ${{ runner.temp }}/corpus-report.md
          if-no-files-found: ignore
